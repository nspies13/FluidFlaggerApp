name: Sync to HF Spaces

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone HF Spaces repo
        run: |
          git clone https://user:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/NickSpies/fluidflagger hf-space

      - name: Sync files to HF Spaces
        run: |
          cd hf-space

          # Configure git for HF
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git remote set-url origin https://user:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/NickSpies/fluidflagger

          # Create orphan branch and wipe entire working tree to avoid
          # carrying over binary files (e.g. .venv) from HF Spaces history
          git checkout --orphan new-main
          git rm -rf --cached .
          find . -mindepth 1 -not -path './.git' -not -path './.git/*' -delete

          # Copy only the files we want
          cp -r ../src .
          cp -r ../data .
          cp ../app.py .
          cp ../requirements.txt .
          cp ../.gitignore .

          git add -A
          git commit -m "Sync from GitHub ($(git rev-parse --short ${{ github.sha }}))"
          git push origin new-main:main --force
