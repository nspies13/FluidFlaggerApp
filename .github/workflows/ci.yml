name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest tests/ -v

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone HF Spaces repo
        run: |
          git clone https://user:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/NickSpies/fluidflagger hf-space

      - name: Sync files and push to HF Spaces
        run: |
          cd hf-space

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git remote set-url origin https://user:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/NickSpies/fluidflagger

          # Orphan commit to wipe HF Spaces history and avoid carrying over binary artifacts
          git checkout --orphan new-main
          git rm -rf --cached .
          find . -mindepth 1 -not -path './.git' -not -path './.git/*' -delete

          cp -r ../src .
          cp -r ../data .
          cp ../app.py .
          cp ../requirements.txt .
          cp ../.gitignore .
          cp ../README.md .

          git add -A
          git commit -m "Sync from GitHub ($(git rev-parse --short ${{ github.sha }}))"
          git push origin new-main:main --force
